[package]
name = "kalpana_shield"
version = "0.1.0"
authors = ["Vijñāna AI <support@vijñānaai.com>"]
edition = "2021"
description = "Proprietary RIF Holographic Memory Engine - Black Box Edition"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s" # Optimize for size
lto = true
